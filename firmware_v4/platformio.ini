; FloodMesh firmware V4 - Heltec WiFi LoRa 32 V3 + 4x4 keypad + active buzzer.
; Field-test build carrying the 27 September 2026 decisions
; (docs/architecture.md section 13): SOS channels, responder-only SOS, ACKs,
; retries, powered units and heartbeats, light sleep. No voice.
;
; This is a separate PlatformIO project; firmware_v3/ and the root firmware
; are not touched by it. Build from the repository root with:
;   pio run -d firmware_v4 -e v4
;   pio run -d firmware_v4 -e v4 -t upload
;   pio device monitor -b 115200
;
; Every unit in a test must run the same env: the spreading factor and the
; preamble decide who can hear whom.
;   v4       SF7, normal preamble. Talks to V3 units (alarms and texts only).
;   v4_sf9   SF9 for the spreading-factor field test (docs/architecture.md 13.7).
;   v4_wake  SF7 with a ~0.5 s wake-up preamble and RX duty cycle on battery,
;            the radio-wake experiment of 13.1. Hears only other v4_wake units.

[platformio]
default_envs = v4

[v4_common]
platform      = espressif32@6.9.0      ; Arduino-ESP32 core 2.0.17, same as V3 and the root
board         = heltec_wifi_lora_32_V3
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = time, esp32_exception_decoder

; Two OTA app slots: a new image runs on trial and the bootloader rolls back
; to the old one if it never proves itself (see the trial note in main.cpp).
board_build.partitions = default_8MB.csv

build_flags =
    -D FLOODMESH_VERSION=\"4.2.0\"
    -D FM_FIRMWARE_V4=1
    -D CORE_DEBUG_LEVEL=2
    ; Serial console on UART0 -> the onboard USB-UART bridge.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM=0
    ; Battery divider gate on GPIO37: ACTIVE HIGH on V3.2, LOW on V3.0/V3.1.
    ; Symptom of the wrong one: battery reads 0.00 V (and V4 then thinks
    ; there is no cell, so it treats the unit as externally powered).
    -D ADC_CTRL_ENABLE_LEVEL=HIGH
    -D VBAT_DIVIDER=4.90f
    -D VBAT_CAL=1.000f
    ;
    ; --- radio: everything except SF and preamble, which each env sets -------
    ; 125 kHz is the regulatory ceiling (G.S.R. 853(E)), not a tuning choice.
    -D FM_LORA_FREQ_MHZ=866.5f
    -D FM_LORA_BW_KHZ=125.0f
    -D FM_LORA_CR=5
    -D FM_LORA_SYNC_WORD=0x12
    -D FM_LORA_TX_DBM=20
    ;
    ; --- duty cycle: 2.5% of any hour ---------------------------------------
    ; Texts and heartbeats are refused when the budget runs low. SOS and ACK
    ; frames are still exempt in software, which is the legal risk noted in
    ; docs/architecture.md 1.1.
    -D FM_DUTY_PERMILLE=25
    ;
    ; --- mesh ----------------------------------------------------------------
    -D FM_HOP_DEFAULT=3
    -D FM_REPLAY_SLOTS=128
    -D FM_DEDUP_SLOTS=128
    ;
    ; --- UI and timing -------------------------------------------------------
    -D FM_SOS_HOLD_MS=3000
    -D FM_SOS_PICK_MS=5000
    -D FM_PING_PERIOD_MS=30000
    -D FM_SCREEN_OFF_MS=60000
    ; SOS: 5 retries after 1, 2, 4, 8, 15 min, then "SOS NOT DELIVERED"
    ; (architecture.md 7.6). After DELIVERED it is re-sent every 15 min until
    ; HELP IS COMING.
    -D FM_SOS_RETRY_MAX=5
    -D FM_SOS_KEEPALIVE_MS=900000UL
    ; Responder reply: hold 4 + 6 this long on the SOS detail screen.
    -D FM_HELP_HOLD_MS=3000
    -D FM_SOS_ESCALATE_MS=900000UL
    ; Medical escalates sooner (value to confirm); unanswered SOS remind every 15 min.
    -D FM_SOS_ESCALATE_MED_MS=300000UL
    -D FM_SOS_REALARM_MS=900000UL
    -D FM_HEARTBEAT_MS=1800000UL
    ; 1 = units on battery light-sleep when idle; "sleep off" on serial disables it.
    -D FM_LIGHT_SLEEP=1
    ; Optional power-sense divider: Heltec 5V -> 100k -> GPIO 3 -> 100k -> GND.
    ; Probed at boot; without it, external power is guessed from the battery
    ; voltage trend (fm_power.h). -1 = never look for it.
    -D FM_PWR_SENSE_PIN=3
    ;
    ; NimBLE (provisioning) needs more than the default 8 kB loop stack.
    -D ARDUINO_LOOP_STACK_SIZE=16384
    ;
    ; --- network key -----------------------------------------------------------
    ; 16-byte pre-shared key authenticating every frame. THIS DEFAULT IS
    ; PUBLIC. Fine for bench tests; generate one per colony before deployment.
    ; All test units must share the same value or they will drop each other's
    ; frames as "FAILED authentication".
    -D FM_PSK_HEX='"000102030405060708090A0B0C0D0E0F"'
    ;
    ; Admin public key from the FloodMesh Admin app (130 hex chars). Leave it
    ; commented for the prototypes: trust on first use over BLE.
    ; -D FM_ADMIN_PUBKEY_HEX='"04...."'

build_src_flags =
    -Wall

lib_deps =
    olikraus/U8g2@^2.35.30
    jgromes/RadioLib@^7.7.1
    ; Pinned to 1.4.x: 2.x changed the callback signatures fm_prov.cpp overrides.
    h2zero/NimBLE-Arduino@~1.4.3
    bblanchon/ArduinoJson@^7.2.0

; SF / preamble are read by fm_radio.h AND by fm_airtime.h's tripwire, so each
; env sets the FM_LORA_* and FM_TOA_* pair together.
[env:v4]
extends = v4_common
build_flags =
    ${v4_common.build_flags}
    -D FM_LORA_SF=7
    -D FM_TOA_SF=7
    -D FM_LORA_PREAMBLE=16
    -D FM_TOA_PREAMBLE=16

[env:v4_sf9]
extends = v4_common
build_flags =
    ${v4_common.build_flags}
    -D FM_LORA_SF=9
    -D FM_TOA_SF=9
    -D FM_LORA_PREAMBLE=16
    -D FM_TOA_PREAMBLE=16

; 512 symbols at SF7 is ~0.52 s: a battery unit's receiver can sleep ~0.5 s
; between checks and still catch every preamble. Every frame costs ~0.5 s more
; airtime (an SOS goes from ~65 ms to ~0.57 s), so this is an experiment until
; the check interval T is decided (architecture.md 13.1, 13.9).
[env:v4_wake]
extends = v4_common
build_flags =
    ${v4_common.build_flags}
    -D FM_LORA_SF=7
    -D FM_TOA_SF=7
    -D FM_LORA_PREAMBLE=512
    -D FM_TOA_PREAMBLE=512
    -D FM_RX_DUTY_CYCLE=1
