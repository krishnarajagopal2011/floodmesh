; FloodMesh firmware V3 - Heltec WiFi LoRa 32 V3 + 4x4 keypad + active buzzer.
; Field-test build: range, relays, texts, SOS. No voice.
;
; This is a separate PlatformIO project; the original firmware in the
; repository root is not touched by it. Build from the repository root with:
;   pio run -d firmware_v3 -e v3
;   pio run -d firmware_v3 -e v3 -t upload
;   pio device monitor -b 115200
;
; V3 and the original firmware share the alarm frame format, so a V3 unit and
; an original unit with the same FM_PSK_HEX hear each other's alarms. Texts
; (frame type 0x03) exist only in V3.

[platformio]
default_envs = v3

[env:v3]
platform      = espressif32@6.9.0      ; Arduino-ESP32 core 2.0.17, same as the root
board         = heltec_wifi_lora_32_V3
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = time, esp32_exception_decoder

board_build.partitions = default_8MB.csv

build_flags =
    -D FLOODMESH_VERSION=\"3.1.0\"
    -D FM_FIRMWARE_V3=1
    -D CORE_DEBUG_LEVEL=2
    ; Serial console on UART0 -> the onboard USB-UART bridge.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM=0
    ; Battery divider gate on GPIO37: ACTIVE HIGH on V3.2, LOW on V3.0/V3.1.
    ; Symptom of the wrong one: battery reads 0.00 V.
    -D ADC_CTRL_ENABLE_LEVEL=HIGH
    -D VBAT_DIVIDER=4.90f
    -D VBAT_CAL=1.000f
    ;
    ; --- radio (identical to the root firmware) ----------------------------
    ; 125 kHz is the regulatory ceiling (G.S.R. 853(E)), not a tuning choice.
    ; SF / CR / PREAMBLE are also read by fm_airtime.h's tripwire, and the
    ; mesh contention slot in fm_mesh.cpp is derived for SF7 / BW125.
    -D FM_LORA_FREQ_MHZ=866.5f
    -D FM_LORA_BW_KHZ=125.0f
    -D FM_LORA_SF=7
    -D FM_LORA_CR=5
    -D FM_LORA_PREAMBLE=16
    -D FM_LORA_SYNC_WORD=0x12
    -D FM_LORA_TX_DBM=20
    ;
    ; --- duty cycle: 2.5% of any hour ---------------------------------------
    ; Texts are refused when the budget is spent. Alarms are still exempt in
    ; software, which is the legal risk noted in docs/architecture.md 1.1.
    -D FM_DUTY_PERMILLE=25
    ;
    ; --- mesh ----------------------------------------------------------------
    -D FM_HOP_DEFAULT=3
    -D FM_REPLAY_SLOTS=128
    -D FM_DEDUP_SLOTS=128
    ;
    ; --- UI --------------------------------------------------------------------
    -D FM_SOS_HOLD_MS=3000
    -D FM_PING_PERIOD_MS=30000
    -D FM_SCREEN_OFF_MS=60000
    ;
    ; NimBLE (provisioning) needs more than the default 8 kB loop stack.
    -D ARDUINO_LOOP_STACK_SIZE=16384
    ;
    ; --- network key -----------------------------------------------------------
    ; 16-byte pre-shared key authenticating alarms and texts. THIS DEFAULT IS
    ; PUBLIC. Fine for bench tests; generate one per colony before deployment.
    ; All test units must share the same value or they will drop each other's
    ; frames as "FAILED authentication".
    -D FM_PSK_HEX='"000102030405060708090A0B0C0D0E0F"'
    ;
    ; Admin public key from the FloodMesh Admin app (130 hex chars). Leave it
    ; commented for the prototypes: trust on first use over BLE.
    ; -D FM_ADMIN_PUBKEY_HEX='"04...."'

build_src_flags =
    -Wall

lib_deps =
    olikraus/U8g2@^2.35.30
    jgromes/RadioLib@^7.7.1
    ; Pinned to 1.4.x: 2.x changed the callback signatures fm_prov.cpp overrides.
    h2zero/NimBLE-Arduino@~1.4.3
    bblanchon/ArduinoJson@^7.2.0
