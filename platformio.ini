; FloodMesh — off-grid store-and-forward emergency communicator
; Target: Heltec WiFi LoRa 32 V3  (ESP32-S3FN8, 8 MB flash, 320 KB usable DRAM,
;                                  no PSRAM, Semtech SX1262)
;
; One build. There are no staged milestone envs: the device ships as a whole,
; so the firmware is compiled as a whole.

[platformio]
default_envs = floodmesh

; ------------------------------------------------------------------ shared base
[env]
platform      = espressif32@6.9.0      ; Arduino-ESP32 core 2.0.17 — stable S3 + LittleFS
board         = heltec_wifi_lora_32_V3
framework     = arduino

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = time, esp32_exception_decoder

; 8 MB flash: dual OTA app slots + a data partition for the voice ring buffer
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

build_flags =
    -D FLOODMESH_VERSION=\"0.3.0\"
    -D CORE_DEBUG_LEVEL=3
    ; Serial console goes out UART0 -> onboard USB-UART bridge.
    ; GPIO19/20 are consumed by the I2S amplifier, so native USB-CDC is
    ; deliberately NOT enabled — turning it on would fight the audio output.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D BOARD_HAS_PSRAM=0
    ; Battery divider gate on GPIO37. V3.2 confirmed on hardware: ACTIVE HIGH.
    ; V3.0/V3.1 are the opposite. Symptom of the wrong one: VBAT reads 0.000 V.
    -D ADC_CTRL_ENABLE_LEVEL=HIGH
    ; 390k/100k divider = 4.90. Trim VBAT_CAL against a multimeter.
    -D VBAT_DIVIDER=4.90f
    -D VBAT_CAL=1.000f

; Pin-map asserts are C++11-compatible on purpose, so the core's default
; -std=gnu++11 is left untouched. Extra warnings apply to our sources only.
build_src_flags =
    -Wall

; ------------------------------------------------------- the actual device
[env:floodmesh]
build_flags =
    ${env.build_flags}
    -D FLOODMESH_FULL=1
    ;
    ; --- radio -----------------------------------------------------------
    ; 125 kHz is a REGULATORY CEILING, not a tuning choice. India's
    ; G.S.R. 853(E) (2021) Table II caps the channel at 200 kHz for this
    ; device class, and the SX1262 offers no 200 kHz step. Do not "optimise"
    ; this to 250 kHz — it would put the device outside every permitted
    ; category in the 865–868 MHz band.
    ; NOTE: SF / CR / PREAMBLE are read by BOTH fm_radio.h and fm_airtime.h's
    ; #error tripwire. If you change one, pass the matching FM_TOA_SF /
    ; FM_TOA_CR_DENOM / FM_TOA_PREAMBLE in the same edit or the build stops
    ; with what looks like an unrelated failure in the airtime module.
    -D FM_LORA_FREQ_MHZ=866.5f
    -D FM_LORA_BW_KHZ=125.0f
    -D FM_LORA_SF=7
    -D FM_LORA_CR=5
    -D FM_LORA_PREAMBLE=16
    -D FM_LORA_SYNC_WORD=0x12
    -D FM_LORA_TX_DBM=20
    ;
    ; --- duty cycle ------------------------------------------------------
    ; Same instrument: 2.5% of any hour. Alarms are exempted in software as a
    ; deliberate life-safety choice; voice is refused when the budget is spent.
    -D FM_DUTY_PERMILLE=25
    ;
    ; --- voice -----------------------------------------------------------
    -D FM_VOICE_MAX_MS=10000
    -D FM_SEND_CONFIRM_MS=3000
    -D FM_SEND_HOLD_MS=600
    -D FM_SEND_ON_TIMEOUT=1
    -D FM_CHORD_JOIN_MS=1000
    ; Playback level. 30 was a bring-up precaution while the amplifier had no
    ; bulk capacitor; that is fitted now, so this is back up. If it is still
    ; quiet, the next lever is hardware: the MAX98357A GAIN pin is currently
    ; floating, which selects its LOWEST setting of 9 dB. Tying GAIN to GND
    ; gives 12 dB, and 100k to GND gives 15 dB.
    -D FM_AUDIO_VOL_DEFAULT=95
    ;
    ; Microphone headroom. Measured on hardware at unity (256): peaks hit the
    ; negative full-scale rail while RMS sat near -21 dBFS, so the INMP441 is
    ; already hot enough to clip on loud syllables. Clipping BEFORE the codec
    ; is the worst place for it - Codec2 fits a vocal-tract model to whatever
    ; it is given, and a squared-off waveform models badly no matter how well
    ; the far end reproduces it. 128 (-6 dB) cured the clipping but left peaks
    ; at only half scale, which is headroom bought and then wasted - and a
    ; quiet recording plays back quiet no matter what the speaker does. 200 is
    ; about -2 dB, putting peaks near 25000 of 32767: clear of the rail, with
    ; the level back.
    -D FM_MIC_GAIN_Q8=200
    ;
    ; --- runtime ---------------------------------------------------------
    ; Codec2 needs a deep stack, and fm_codec refuses to encode below 20 kB
    ; free. Measured on this board: 24576 left only ~15 kB by the time the
    ; codec ran, so voice was silently dead. 49152 clears it with margin.
    -D ARDUINO_LOOP_STACK_SIZE=49152
    ;
    ; --- network key -----------------------------------------------------
    ; 16-byte pre-shared key authenticating Layer 1 alarms.
    ; THIS DEFAULT IS PUBLIC AND AUTHENTICATES NOTHING — it is in the source
    ; tree, so every FloodMesh build shares it. Generate one per colony before
    ; deployment. The firmware prints a warning at boot while it is in use.
    -D FM_PSK_HEX='"000102030405060708090A0B0C0D0E0F"'

lib_deps =
    olikraus/U8g2@^2.35.30
    jgromes/RadioLib@^7.7.1
    sh123/esp32_codec2@^1.0.7
