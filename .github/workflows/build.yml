# Builds every firmware environment and the Android admin app on each push.
# Download the results from the run's "Artifacts" section on GitHub.
name: build

on:
  push:
    branches: ["9th-Sept-2026", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [floodmesh, proto_v2, proto_v2_selftest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error

  admin-app:
    runs-on: ubuntu-latest
    env:
      # Optional fixed signing key (see app/floodmesh_admin/README.md).
      FM_KS_B64: ${{ secrets.FM_ANDROID_KEYSTORE_B64 }}
      FM_KEYSTORE_PASSWORD: ${{ secrets.FM_KEYSTORE_PASSWORD }}
      FM_KEY_ALIAS: ${{ secrets.FM_KEY_ALIAS }}
      FM_KEY_PASSWORD: ${{ secrets.FM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the app is present
        id: chk
        run: |
          if [ -f app/floodmesh_admin/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "app/floodmesh_admin not on this branch yet - skipping the APK build"
          fi
      - if: steps.chk.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.chk.outputs.present == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5   # the version the app was written and tested with
          cache: true
      - name: Decode signing key (only if the secret is set)
        if: steps.chk.outputs.present == 'true' && env.FM_KS_B64 != ''
        run: |
          echo "$FM_KS_B64" | base64 -d > "$RUNNER_TEMP/fm-release.jks"
          echo "FM_KEYSTORE_PATH=$RUNNER_TEMP/fm-release.jks" >> "$GITHUB_ENV"
      - if: steps.chk.outputs.present == 'true'
        working-directory: app/floodmesh_admin
        run: flutter pub get
      - if: steps.chk.outputs.present == 'true'
        working-directory: app/floodmesh_admin
        run: flutter analyze
      - if: steps.chk.outputs.present == 'true'
        working-directory: app/floodmesh_admin
        run: flutter test
      - if: steps.chk.outputs.present == 'true'
        working-directory: app/floodmesh_admin
        run: flutter build apk --release
      - name: Upload APK
        if: steps.chk.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: floodmesh-admin-apk
          path: app/floodmesh_admin/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
